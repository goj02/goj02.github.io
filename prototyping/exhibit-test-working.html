<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Three.js Virtual Room</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
    }
    .page { max-width: 1100px; margin: 0 auto; padding: 16px; }
    #roomContainer {
      width: 100%;
      height: 70vh;
      min-height: 500px;
      border: 1px solid #333;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      background: #000;
      cursor: default;
    }
    #description {
      margin-top: 12px;
      padding: 12px 14px;
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 12px;
      line-height: 1.5;
    }
    #instructions {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 2;
      background: rgba(0,0,0,0.55);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      pointer-events: none;
    }
    #popup {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.55);
      z-index: 10;
    }
    #popupContent {
      background: #fff;
      color: #111;
      max-width: 360px;
      width: calc(100% - 32px);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    #popupContent h3 { margin: 0 0 8px; }
    #closePopup {
      margin-top: 14px;
      padding: 8px 12px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      background: #111;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="page">
    <div id="roomContainer">
      <div id="instructions">Click and drag to look around. WASD/arrow keys move. Hover and click the sphere or cylinder.</div>
    </div>
    <div id="description">
      A simple virtual room rendered with Three.js, containing a sphere and a cylinder that you can explore and inspect.
    </div>
  </div>

  <div id="popup">
    <div id="popupContent">
      <h3 id="popupTitle"></h3>
      <p id="popupText"></p>
      <button id="closePopup">Close</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const container = document.getElementById('roomContainer');
    const popup = document.getElementById('popup');
    const popupTitle = document.getElementById('popupTitle');
    const popupText = document.getElementById('popupText');
    const closePopup = document.getElementById('closePopup');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x20242a);
    scene.fog = new THREE.Fog(0x20242a, 10, 40);

    const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = false;
    controls.minDistance = 2;
    controls.maxDistance = 18;
    controls.maxPolarAngle = Math.PI * 0.49;

    const roomSize = 16;
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 1 });
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x7a7f86, roughness: 1 });
    const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x9199a1, roughness: 1 });

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, roomSize), floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, roomSize), ceilingMat);
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.y = 6;
    scene.add(ceiling);

    const wallGeo = new THREE.PlaneGeometry(roomSize, 6);
    const makeWall = (rotY, x, z) => {
      const wall = new THREE.Mesh(wallGeo, wallMat);
      wall.rotation.y = rotY;
      wall.position.set(x, 3, z);
      scene.add(wall);
    };
    makeWall(0, 0, -roomSize / 2);
    makeWall(Math.PI, 0, roomSize / 2);
    makeWall(Math.PI / 2, -roomSize / 2, 0);
    makeWall(-Math.PI / 2, roomSize / 2, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const point = new THREE.PointLight(0xffffff, 80, 40);
    point.position.set(0, 5, 0);
    scene.add(point);

    const sphereMat = new THREE.MeshStandardMaterial({ color: 0x4aa3ff, metalness: 0.2, roughness: 0.3 });
    const cylinderMat = new THREE.MeshStandardMaterial({ color: 0xff9f43, metalness: 0.15, roughness: 0.5 });

    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.8, 32, 32),
      sphereMat
    );
    sphere.position.set(-2, 1.2, 0);
    scene.add(sphere);

    const cylinder = new THREE.Mesh(
      new THREE.CylinderGeometry(0.5, 0.5, 2, 32),
      cylinderMat
    );
    cylinder.position.set(2, 1, -1);
    scene.add(cylinder);

    const objects = [
      { mesh: sphere, title: 'Sphere', text: 'A smooth round object with a blue finish.', baseColor: 0x4aa3ff },
      { mesh: cylinder, title: 'Cylinder', text: 'A tall circular object with an orange finish.', baseColor: 0xff9f43 }
    ];

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hovered = null;

    function setHoverState(target) {
      if (hovered && hovered !== target) {
        const prev = objects.find(o => o.mesh === hovered);
        if (prev) prev.mesh.material.emissive.setHex(0x000000);
      }

      hovered = target;

      if (hovered) {
        const current = objects.find(o => o.mesh === hovered);
        if (current) current.mesh.material.emissive.setHex(0x004444);
        container.style.cursor = 'pointer';
      } else {
        container.style.cursor = 'default';
      }
    }

    function showPopup(title, text) {
      popupTitle.textContent = title;
      popupText.textContent = text;
      popup.style.display = 'flex';
    }

    closePopup.addEventListener('click', () => popup.style.display = 'none');
    popup.addEventListener('click', (e) => {
      if (e.target === popup) popup.style.display = 'none';
    });

    function updateHover(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(objects.map(o => o.mesh), false);

      if (hits.length) setHoverState(hits[0].object);
      else setHoverState(null);
    }

    renderer.domElement.addEventListener('pointermove', updateHover);

    renderer.domElement.addEventListener('pointerdown', (event) => {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(objects.map(o => o.mesh), false);

      if (hits.length) {
        const hit = objects.find(o => o.mesh === hits[0].object);
        if (hit) showPopup(hit.title, hit.text);
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });
  </script>
</body>
</html>
